name: docker-verify (temporary)
on: push
env:
  URLS: "http://localhost:5190/ http://localhost:5190/about http://localhost:5190/agentgate.html"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          sleep 5
          for u in $URLS; do curl -fsS -o /dev/null -w "$u %{http_code}\n" --retry 10 --retry-delay 3 --retry-all-errors "$u"; done
      - name: Logs
        if: always()
        run: docker compose ps -a; docker compose logs --no-color --tail=80
