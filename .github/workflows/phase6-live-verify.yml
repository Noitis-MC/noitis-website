name: Verify Phase 6 bilingual live site

on:
  push:
    branches: [phase-6]

permissions:
  contents: read

jobs:
  verify:
    name: English and Greek live smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify bilingual live publication
        env:
          SITE_URL: https://noitis-mc.github.io/noitis-website/
        run: npm run check:browser:live
